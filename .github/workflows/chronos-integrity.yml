name: Chronos dispatcher (custom App authoritative)

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dispatcher:
    name: dispatcher (custom App authoritative)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out pull request
        uses: actions/checkout@v4
      - name: Confirm custom App policy authority
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            test "${{ github.base_ref }}" = "repair-base"
          fi
          {
            echo "### Chronos dispatch result"
            echo
            echo "The required custom App check \`Chronos / integrity\` is the policy authority."
            echo "Expected invalid or recurrence findings are reported as **BLOCKED BY CHRONOS POLICY** there."
            echo "This dispatcher is green when infrastructure succeeds and never relabels a policy verdict as **PIPELINE EXECUTION FAILED**."
          } >> "$GITHUB_STEP_SUMMARY"
