name: Chronos Integrity

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chronos-integrity:
    name: Chronos Integrity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Guardrail regression tests
        run: python -m unittest discover -s chronos_tests -v
      - name: Enforce imported experiment policy
        run: python tools/chronos_integrity_check.py --json-output chronos-check.json
      - name: Preserve Chronos evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chronos-integrity-${{ github.run_id }}
          path: chronos-check.json
          if-no-files-found: warn
          retention-days: 30
